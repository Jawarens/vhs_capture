[package]
name = "vhs_core"
version = "0.4.1"
edition = "2021"

[lib]
name = "vhs_core"
crate-type = ["cdylib", "rlib"]   # Python extension (.pyd / .so) + rlib for cargo test

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true          # link-time optimisation — smaller, faster binary
codegen-units = 1   # single codegen unit for maximum optimisation
panic = "abort"     # no unwinding overhead
