name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CI: true
      PYTHONUTF8: 1
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            ~\vhs_capture\vhs_core\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vhs_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pyinstaller PyQt6 opencv-python numpy sounddevice imageio-ffmpeg

      - name: Install MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run Windows build script
        shell: cmd
        run: build_windows.bat

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhs-capture-windows
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: false
          generate_release_notes: true
